worker_processes 1;

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    client_max_body_size 1m;

    # DNS Docker. Имена сервисов резолвятся при КАЖДОМ запросе,
    # поэтому nginx стартует и работает, даже если lab-web остановлен.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Ограничение частоты запросов: запасной слой, основная защита в приложении ---
    # В Docker все участники приходят с одного адреса, поэтому лимиты общие и щедрые:
    # они останавливают перебор паролей и флагов скриптом, но не мешают обычной игре.
    # Пустой ключ означает «не ограничивать», так что лимиты действуют только на POST-формы.
    map "$request_method:$uri" $limit_auth_key {
        default "";
        "~^POST:/(login|register)$" $binary_remote_addr;
    }
    map "$request_method:$uri" $limit_flag_key {
        default "";
        "~^POST:/challenges/[0-9]+/submit$" $binary_remote_addr;
    }
    limit_req_zone $limit_auth_key zone=auth_zone:1m rate=30r/m;
    limit_req_zone $limit_flag_key zone=flag_zone:1m rate=120r/m;
    limit_req_status 429;

    server {
        listen 80;

        # Заголовки проксирования. Наследуются локациями, у которых нет своих proxy_set_header.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # --- Статика: стили, файлы заданий WEB-02 и CRYPTO-01 (раздаёт Nginx, не приложение) ---
        location /static/ {
            alias /usr/share/nginx/static/;
            charset utf-8;
            charset_types text/css text/plain text/html application/javascript text/javascript;
            add_header X-Content-Type-Options nosniff;
        }

        # --- Лаборатория: /lab/ -> lab-web:5000 (префикс срезается) ---
        location = /lab { return 301 /lab/; }

        location /lab/ {
            set $lab_upstream lab-web:5000;
            rewrite ^/lab/(.*)$ /$1 break;
            proxy_pass http://$lab_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /lab;

            proxy_connect_timeout 2s;
            proxy_read_timeout    15s;

            # лаборатория остановлена -> понятная страница, платформа не страдает
            error_page 502 503 504 = @lab_down;
        }

        location @lab_down {
            default_type text/html;
            charset utf-8;
            return 503 '<!doctype html><meta charset="utf-8"><title>Лаборатория недоступна</title><h1>Лаборатория временно недоступна</h1><p>Платформа и рейтинг работают. Попросите преподавателя запустить контейнер: <code>docker compose start lab-web</code></p><p><a href="/">Вернуться на платформу</a></p>';
        }

        # --- Платформа: всё остальное -> app:8000 ---
        location / {
            limit_req zone=auth_zone burst=20 nodelay;
            limit_req zone=flag_zone burst=60 nodelay;

            set $app_upstream app:8000;
            proxy_pass http://$app_upstream;
        }
    }
}
