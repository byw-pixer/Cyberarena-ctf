{% extends "base.html" %}
{% block title %}Смена пароля · CYBERARENA{% endblock %}
{% block crumb %}АККАУНТ / БЕЗОПАСНОСТЬ{% endblock %}
{% block page_title %}Смена начального пароля{% endblock %}
{% block content %}
<div class="auth-shell">
  <h2>Смена пароля</h2>
  <p>Начальный пароль нужно сменить перед работой.</p>
  <form class="admin-form" action="/change-password" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <div class="form-control"><label for="old_password">Текущий пароль</label><input class="field" id="old_password" type="password" name="old_password" required autocomplete="current-password"></div>
    <div class="form-control"><label for="new_password">Новый пароль (12+ символов)</label><input class="field" id="new_password" type="password" name="new_password" required minlength="12" autocomplete="new-password"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:7px" type="submit">Сохранить</button>
  </form>
</div>
{% endblock %}
