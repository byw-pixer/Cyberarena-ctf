<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сейф на JavaScript</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#0b1424;color:#e6edf7}
    main{max-width:520px;margin:64px auto;padding:0 20px}
    .card{background:#12203a;border:1px solid #223556;border-radius:10px;padding:20px}
    input{width:100%;box-sizing:border-box;padding:10px;margin:12px 0;border-radius:6px;
          border:1px solid #223556;background:#0b1424;color:#e6edf7;font:inherit}
    button{padding:10px 18px;border:0;border-radius:6px;background:#b6f23c;color:#0b1424;
           font-weight:600;cursor:pointer}
    #result{margin-top:14px;min-height:1.4em;color:#8fd3ff}
    .muted{color:#8a9bb8;font-size:14px}
  </style>
</head>
<body>
  <main>
    <h1>Сейф на JavaScript</h1>
    <div class="card">
      <p>Введите код доступа. Проверка выполняется прямо в вашем браузере.</p>
      <form id="vault-form">
        <input id="code" type="text" placeholder="Код доступа" autocomplete="off">
        <button type="submit">Открыть</button>
      </form>
      <div id="result"></div>
    </div>
    <p class="muted">Учебное задание CyberArena. Опасных действий над вашим компьютером страница не выполняет.</p>
  </main>
  <script src="vault.js"></script>
</body>
</html>
