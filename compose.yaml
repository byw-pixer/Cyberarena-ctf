# CyberArena: запуск одной командой, без .env и без скриптов
#   docker compose up -d --build
# Сайт: http://localhost:8080
#
# Все значения ниже имеют безопасные значения по умолчанию. Чтобы задать свои, создайте файл .env
# (пример: .env.example). При первом запуске случайный пароль администратора
# сохраняется в закрытом файле /data/admin-bootstrap внутри контейнера.

name: cyberarena

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- Единственная точка входа. Слушает только 127.0.0.1 ---
  nginx:
    image: nginx:1.27-alpine
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${CYBERARENA_PORT:-8080}:8080"
    volumes:
      - ./nginx/compose.conf:/etc/nginx/nginx.conf:ro
    networks: [app-net, lab-net]
    depends_on:
      app:
        condition: service_healthy   # лабораторию НЕ ждём: платформа должна жить без неё
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpus: 0.25
    pids_limit: 64
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

  # --- Платформа (FastAPI + SQLite). Сама создаёт базу, администратора и задания ---
  app:
    build: ./app
    environment:
      DATABASE_URL: sqlite:////data/cyberarena.db
      ADMIN_USERNAME: "${ADMIN_USERNAME:-teacher}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"     # пусто = случайный пароль при первом запуске
      SECRET_KEY: "${SECRET_KEY:-}"             # пусто = случайный ключ, сохраняется в томе /data
      DEPLOYMENT_NAME: "${COMPOSE_PROJECT_NAME:-cyberarena}"
      DEMO_RESET: "${DEMO_RESET:-false}"
      FLAG_REVISION: "${FLAG_REVISION:-}"
      LAB_FLAG_DIR: /lab-flags
      WEB01_FLAG: "${WEB01_FLAG:-}"
      WEB02_FLAG: "${WEB02_FLAG:-}"
      CRYPTO01_FLAG: "${CRYPTO01_FLAG:-}"
    volumes:
      - lab_flags:/lab-flags
      - db_data:/data               # база и ключ переживают restart и down (но не down -v)
    networks: [app-net]             # лаборатория сюда НЕ подключена
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
    logging: *default-logging

  # --- Уязвимая учебная лаборатория WEB-01 (изолирована) ---
  lab-web:
    build: ./lab
    networks: [lab-net]             # только lab-net, а она internal (без интернета)
    expose: ["5000"]
    volumes:
      - lab_flags:/lab-flags:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    # НЕТ: privileged, network_mode: host, монтирования docker.sock, сети app-net и тома db_data

networks:
  app-net: {}                       # nginx <-> app
  lab-net:
    internal: true                  # nginx <-> lab-web, без выхода в интернет

volumes:
  db_data: {}
  lab_flags: {}
